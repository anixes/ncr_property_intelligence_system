name: Deploy ML App

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'web-app/**'
      - 'README.md'
      - 'SPEC.md'
      - '.gsd/**'
      - '.stitch/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Debug - List DAGsHub repo tree
        env:
          DH_USER: ${{ secrets.DAGSHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          API="https://dagshub.com/api/v1/repos/${DH_USER}/ncr_property_price_estimation/contents"
          for dir in "" "models" "models/sales" "models/rentals" "data" "data/model"; do
            echo "=== /${dir} ==="
            curl -fsSL -u "${DH_USER}:${DH_TOKEN}" "${API}/${dir}" | head -c 3000 || echo "(listing failed)"
            echo ""
          done

      - name: Fetch ML Assets from DAGsHub
        env:
          DH_USER: ${{ secrets.DAGSHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          BASE="https://dagshub.com/${DH_USER}/ncr_property_price_estimation/raw/main"
          ASSETS=(
            "models/sales/pipeline_sales.joblib"
            "models/rentals/pipeline_rentals.joblib"
            "data/locality_intelligence_index.json"
            "data/model/model_sales.parquet"
            "data/model/model_rentals.parquet"
          )
          for asset in "${ASSETS[@]}"; do
            echo "Downloading ${asset}..."
            mkdir -p "$(dirname "$asset")"
            curl -fsSL --retry 3 --retry-delay 5 -u "${DH_USER}:${DH_TOKEN}" \
              -o "$asset" "${BASE}/${asset}" || { echo "CRITICAL: Failed to fetch ${asset}"; exit 1; }
          done

      - name: Verify data integrity & Asset Hash Audit
        run: |
          echo "=== Model Binary Hashes ==="
          sha256sum models/sales/pipeline_sales.joblib
          sha256sum models/rentals/pipeline_rentals.joblib
          
          echo "=== Intelligence Layer Data Hashes ==="
          sha256sum data/locality_intelligence_index.json
          sha256sum data/model/model_sales.parquet
          sha256sum data/model/model_rentals.parquet
          
          echo "=== Full Data Inventory ==="
          ls -R data/

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag and Lowercase Repo
        run: |
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-api:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.REPO_LOWER }}-api:latest

#      - name: Build and Push Frontend Image
#        uses: docker/build-push-action@v5
#        with:
#          context: .
#          file: ./Dockerfile.frontend
#          push: true
#          tags: |
#            ghcr.io/${{ env.REPO_LOWER }}-frontend:${{ env.IMAGE_TAG }}
#            ghcr.io/${{ env.REPO_LOWER }}-frontend:latest

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/apps/ncr-app/"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30m
          script: |
            mkdir -p ~/apps/ncr-app
            cd ~/apps/ncr-app
            if [ ! -f .env ]; then
              echo "API_BASE_URL=http://api:8000" > .env
              echo "GITHUB_REPOSITORY=${{ env.REPO_LOWER }}" >> .env
            fi
            export GITHUB_REPOSITORY=${{ env.REPO_LOWER }}
            
            # Authenticate with GHCR to allow pulls
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f

      - name: Post-Deploy Smoke Test (Confidence Layer)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30m
          script: |
            echo "Waiting 15s for 'Pure ML' model loading and container warmup..."
            sleep 15
            echo "Running healthcheck on EC2..."
            if curl -f http://localhost:8000/health; then
              echo "SUCCESS: API is up and healthy."
            else
              echo "FAILURE: Healthcheck failed! Checking logs..."
              cd ~/apps/ncr-app/
              docker compose logs api --tail 50
              exit 1
            fi
